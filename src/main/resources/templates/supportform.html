<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            color: #34495e;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #2c3e50;
        }
        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1.5px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            border-color: #27ae60;
            outline: none;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #1e8c43;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Support Form</h2>
    <form>
        <label for="supportTeam">Support Team Name</label>
        <input type="text" id="supportTeam" name="supportTeam" placeholder="Enter support team or agent name" required />

        <label for="contactEmail">Support Email</label>
        <input type="email" id="contactEmail" name="contactEmail" placeholder="Enter support email" required />

        <label for="supportHours">Support Hours</label>
        <input type="text" id="supportHours" name="supportHours" placeholder="e.g., Mon-Fri 9AM to 6PM" required />

        <label for="supportTypes">Types of Support Offered</label>
        <textarea id="supportTypes" name="supportTypes" placeholder="Describe the support provided" required></textarea>

        <label for="escalation">Escalation Contact Info</label>
        <input type="text" id="escalation" name="escalation" placeholder="Contact info for escalation" />

        <button type="submit">Submit Support Info</button>
    </form>
</div>
</body>
</html>
