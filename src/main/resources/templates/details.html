<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Item Specification Sections</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
<style>

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 2rem;
    background-color: #f9f9f9;
    color: #333;
}

form {
    background-color: #fff;
    border-radius: 10px;
    padding: 2rem;
    margin-bottom: 2rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem 2rem;
}

h2 {
    grid-column: 1 / -1;
    font-size: 1.5rem;
    margin-bottom: 1rem;
    color: #333;
    border-bottom: 2px solid #ddd;
    padding-bottom: 0.5rem;
}

label {
    display: flex;
    flex-direction: column;
    font-weight: 600;
    gap: 0.3rem;
}

input[type="text"],
input[type="number"],
input[type="email"],
input[type="tel"],
input[type="date"],
select,
textarea,
input[type="file"] {
    width: 100%;
    padding: 5px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 14px;
    margin-top: 5px;
    box-sizing: border-box;

}

textarea {
    resize: vertical;
    min-height: 80px;
}

.full-width {
    grid-column: 1 / -1;
}

.buttons {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    margin-top: 1rem;
}

.save-btn,
.cancel-btn {
    padding: 0.6rem 1.5rem;
    border: none;
    border-radius: 5px;
    font-size: 1rem;
    cursor: pointer;
}

.save-btn {
    background-color: #333;
    color: #fff;
}

.cancel-btn {
    background-color: #e0e0e0;
    color: #333;
}

.save-btn:hover {
    background-color: #555;
}

.cancel-btn:hover {
    background-color: #c5c5c5;
}

/* Checkbox Grouping */
label input[type="checkbox"] {
    margin-right: 0.5rem;
    transform: scale(1.1);
}
.addon-group {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem 2rem;
    margin-bottom: 1rem;
}

.addon-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: normal;
}

/* Optional: Responsive tweak for very small devices */
@media (max-width: 480px) {
    form {
        grid-template-columns: 1fr;
    }

    .buttons {
        flex-direction: column;
        align-items: stretch;
    }

    .save-btn,
    .cancel-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<form method="post" action="/item/save">
    <h2>Item Details</h2>

    <!-- Basic Info -->
    <label>Item Name
        <input type="text" name="item_name" required>
    </label>
    <label>Category
        <input type="text" name="category">
    </label>
    <label>Model / Serial No.
        <input type="text" name="model_serial">
    </label>
    <label>Brand / Manufacturer
        <input type="text" name="brand">
    </label>

    <!-- Location & Status -->
    <label>Location / Storage
        <input type="text" name="location">
    </label>
    <label>Condition
        <select name="condition">
            <option value="">Select</option>
            <option value="New">New</option>
            <option value="Good">Good</option>
            <option value="Fair">Fair</option>
            <option value="Poor">Poor</option>
            <option value="Damaged">Damaged</option>
        </select>
    </label>
    <label>Status
        <select name="status">
            <option value="">Select</option>
            <option value="Active">Active</option>
            <option value="In Repair">In Repair</option>
            <option value="Retired">Retired</option>
        </select>
    </label>

    <!-- Supplier / Department -->
    <label>Supplier / Vendor
        <input type="text" name="supplier">
    </label>
    <label>Department / Owner
        <input type="text" name="department">
    </label>

    <!-- Description / Notes -->
    <label class="full-width">Description
        <textarea name="description"></textarea>
    </label>
    <label class="full-width">Notes / Comments
        <textarea name="notes"></textarea>
    </label>

    <div class="buttons">
        <button type="submit" class="save-btn">Save</button>
        <button type="reset" class="cancel-btn">Cancel</button>
    </div>
</form>

<form method="post" action="/warranty/save">
    <h2>Warranty Information</h2>

    <!-- Warranty Type & Provider -->
    <label>Warranty Type
        <select name="warrantyType" required>
            <option value="">Select</option>
            <option value="Manufacturer">Manufacturer</option>
            <option value="Extended">Extended</option>
            <option value="Service">Service Contract</option>
            <option value="Parts">Parts Warranty</option>
            <option value="Labor">Labor Warranty</option>
        </select>
    </label>
    <label>Warranty Provider
        <input type="text" name="warrantyProvider" required>
    </label>

    <!-- Duration -->
    <label>Warranty Start Date
        <input type="date" name="warrantyStart" required>
    </label>
    <label>Warranty Expiry Date
        <input type="date" name="warrantyExpiry" required>
    </label>

    <!-- Coverage -->
    <label class="full-width">Coverage Details
        <textarea name="warrantyCoverage" required placeholder="E.g., Includes parts, labor, on-site support"></textarea>
    </label>

    <div class="buttons">
        <button type="submit" class="save-btn">Save</button>
        <button type="reset" class="cancel-btn">Cancel</button>
    </div>
</form>

<form method="post" action="/insurance/save" enctype="multipart/form-data">
    <h2>Insurance Details</h2>

    <!-- Basic Info -->
    <label>Company Name
        <input type="text" name="insurerName" required>
    </label>
    <label>Policy Number
        <input type="text" name="policyNumber" required>
    </label>
    <label>Item Category
        <select name="itemCategory" required>
            <option value="">-- Select Category --</option>
            <option value="metal">Metal</option>
            <option value="wood">Wood</option>
            <option value="plastic">Plastic</option>
            <option value="glass">Glass</option>
            <option value="electronics">Electronics</option>
            <option value="textile">Textile</option>
            <option value="chemical">Chemical</option>
            <option value="other">Other</option>
        </select>
    </label>
    <label>Insurance Type
        <select name="insuranceType" required>
            <option value="">-- Select Insurance Type --</option>
            <option value="fire_theft">Fire & Theft</option>
            <option value="comprehensive">Comprehensive</option>
            <option value="third_party">Third‑Party Only</option>
            <option value="transit">Transit Insurance</option>
            <option value="equipment_breakdown">Equipment Breakdown</option>
            <option value="natural_disaster">Natural Disaster Cover</option>
            <option value="return_to_invoice">Return-to-Invoice</option>
            <option value="business_interruption">Business Interruption</option>
            <option value="other">Other</option>
        </select>
    </label>

    <!-- Coverage Info -->
    <label>Sum Insured
        <input type="number" name="sumInsured" step="0.01" min="0" required>
    </label>
    <label>Declared Value
        <input type="number" name="insuredValue" step="0.01" min="0" required>
    </label>
    <label>Premium Amount
        <input type="number" name="premiumAmount" step="0.01" min="0" required>
    </label>
    <label>Deductible / Excess
        <input type="number" name="deductible" step="0.01" min="0" required>
    </label>
    <label>Claim Limit per Event
        <input type="number" name="claimLimit" step="0.01" min="0">
    </label>

    <!-- Dates -->
    <label>Policy Start Date
        <input type="date" id="policyStartDate" name="policyStartDate" required>
    </label>
    <label>Policy Expiry Date
        <input type="date" id="policyExpiryDate" name="policyExpiryDate" required>
    </label>
    <label>Last Claim Date
        <input type="date" id="lastClaimDate" name="lastClaimDate">
    </label>

    <!-- Payment & Bonus -->
    <label>Payment Frequency
        <select name="paymentFrequency" required>
            <option value="">-- Select Payment Frequency --</option>
            <option value="annual">Annual</option>
            <option value="semi_annual">Semi-Annual</option>
            <option value="quarterly">Quarterly</option>
            <option value="monthly">Monthly</option>
            <option value="single">Single Payment</option>
            <option value="other">Other</option>
        </select>
    </label>
    <label>No‑Claim Bonus (NCB)
        <input type="text" name="ncbStatus" placeholder="e.g., 20%, Protected by Rider">
    </label>

    <!-- Add‑Ons -->
    <!-- Add‑Ons -->
    <label class="full-width">Add‑Ons (Optional)</label>
    <div class="addon-group full-width">
        <label class="addon-item">
            <input type="checkbox" name="keyRiders" value="Zero Depreciation">
            Zero Depreciation
        </label>
        <label class="addon-item">
            <input type="checkbox" name="keyRiders" value="Return-to-Invoice">
            Return-to-Invoice
        </label>
        <label class="addon-item">
            <input type="checkbox" name="keyRiders" value="Engine & Gearbox Protection">
            Engine & Gearbox Protection
        </label>
        <label class="addon-item">
            <input type="checkbox" name="keyRiders" value="Roadside Assistance">
            Roadside Assistance
        </label>
        <label class="addon-item">
            <input type="checkbox" id="addonOtherCheckbox" name="keyRiders" value="Other">
            Other
        </label>
    </div>
    <label class="full-width">
        <input type="text" id="addonOtherText" name="addonOtherText" placeholder="Please specify" style="display:none;">
    </label>


    <!-- Contact Info -->
    <label class="full-width">Contact for Claims</label>
    <label>Name
        <input type="text" name="claimsContactName" required>
    </label>
    <label>Phone
        <input type="tel" name="claimsContactPhone" required>
    </label>
    <label>Email
        <input type="email" name="claimsContactEmail" required>
    </label>

    <!-- File Upload -->
    <label class="full-width">Upload Policy Document
        <input type="file" name="policyDocument" accept=".pdf,.doc,.docx,.jpg,.png" required>
    </label>

    <div class="buttons">
        <button type="submit" class="save-btn">Save</button>
        <button type="reset" class="cancel-btn">Cancel</button>
    </div>
</form>


<script>
    document.getElementById('policyStartDate')?.addEventListener('change', function () {
        document.getElementById('policyExpiryDate')?.setAttribute('min', this.value);
    });

    window.addEventListener('DOMContentLoaded', function () {
        const start = document.getElementById('policyStartDate')?.value;
        if (start) document.getElementById('policyExpiryDate')?.setAttribute('min', start);
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('lastClaimDate')?.setAttribute('max', today);
    });

    const otherCheckbox = document.getElementById('addonOtherCheckbox');
    const otherText = document.getElementById('addonOtherText');
    if (otherCheckbox && otherText) {
        otherCheckbox.addEventListener('change', function () {
            otherText.style.display = this.checked ? 'block' : 'none';
            otherText.required = this.checked;
            if (!this.checked) otherText.value = '';
        });
    }
</script>

</body>
</html>
