<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Good Issue Reports</title>
    <link rel="stylesheet" href="/css/reports/goodissuereport.css">
</head>
<body>
<div th:replace="header :: header"></div>
<div class="custom-form-container">
<h1>Good Issue Reports</h1>
<div class="custom-form-row">
    <div class="form-group">
        <label for="filterDateFrom">Date From</label>
        <input type="date" id="filterDateFrom"/>
    </div>

    <div class="form-group">
        <label for="filterDateTo">Date To</label>
        <input type="date" id="filterDateTo"/>
    </div>

    <div class="form-group">
        <label for="filterbranch">Branch</label>
        <select class="form-select" id="filterbranch">
            <option value="">Select Branch</option>
            <option>Kathmandu</option>
            <option>Pokhara</option>
            <option>Biratnagar</option>
        </select>
    </div>


    <div class="form-group">
        <label for="issuedTo" class="form-label">Issued To</label>
        <select class="form-select" id="issuedTo">
            <option value="">Select Issued To</option>
            <option>John Doe</option>
            <option>Jane Smith</option>
            <option>Michael Brown</option>
            <option>Sita Sharma</option>
            <option>Ram Bahadur</option>
            <option>Hari Prasad</option>
            <option>Anita Karki</option>
            <option>Bikash Thapa</option>
            <option>Dinesh Shrestha</option>
            <option>Rita Lama</option>
            <option>Suman Gurung</option>
            <option>Kiran KC</option>
            <option>Manish Yadav</option>
            <option>Sunita Rai</option>
            <option>Prakash Adhikari</option>
            <option>Mina Shrestha</option>
            <option>Ramesh Bista</option>
            <option>Sujata Basnet</option>
        </select>
    </div>

    <div class="form-group">
        <label for="status">Status</label>
        <select id="status">
            <option>Select Status</option>
            <option>Pending</option>
            <option>Transit</option>
            <option>Delivered</option>
        </select>
    </div>
    <div class="form-actions">
        <input type="text" placeholder="Search..." id="generalSearch"/>
        <button class="custom-btn-search">SEARCH</button>
        <button class="custom-btn-reset">RESET</button>
    </div>
</div>
<section th:replace="layout/table"></section>
</div>
<script src="/js/reports/goodissuereport.js"></script>
</body>
</html>
