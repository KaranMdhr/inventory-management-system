<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Goods Receiving Note - Inventory System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/operations/goodreceivingnote.css">
</head>
<body>
<div th:replace="header :: header"></div>
<div class="container">
    <h2>Goods Receiving Note (GRN)</h2>
    <form id="grnForm" method="POST">
        <div class="form-section">
            <div class="form-group">
                <label for="grnNumber">GRN Code</label>
                <input type="text" id="grnNumber" name="grnNumber" value="HS12345" readonly>
            </div>
            <div class="form-group">
                <label for="company">Company</label>
                    <input type="text" id="company" name="companyId" value="Hari saran suppliers" readonly>
            </div>
            <div class="form-group">
                <label for="poNumber">Purchase Order Code</label>
                <input type="text" id="poNumber" name="poNumber" list="poNumberList" value="PO-2001" readonly>
                <datalist id="poNumberList"></datalist>
            </div>
            <div class="form-group">
                <label for="receivedDate">Date Received</label>
                <input type="text" id="receivedDate" name="receivedDate" value="01/21/2002" readonly>
            </div>
        </div>

        <table id="itemsTable">
            <thead>
            <tr>
                <th class="damage-column">Damage?</th>
                <th>Item</th>
                <th>Quantity</th>
                <th>Unit</th>
                <th>Remaining</th>
                <th>Rate</th>
                <th>Total</th>
                <th class="damage-column">Damage</th>
                <th class="addons-column">Addons</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td class="damage-column"> 1</td>
                <td><input type="text" name="item[]" value="book" readonly></td>
                <td><input type="number" name="quantity[]" value="20" readonly></td>
                <td><input type="text" name="unit[]" value="pcs" readonly></td>
                <td><input type="number" name="remaining[]" value="10" readonly></td>
                <td><input type="number" name="rate[]" value="10" readonly></td>
                <td><input type="number" name="total[]" value="10" readonly></td>
                <td class="damage-column"><input type="text" class="damage-spec" name="damageSpec[]" value="none" readonly></td>
                <td class="addons-column">
                    <button type="button" onclick="location.href='/inventoryInsuranceRecord'">Insurance</button>
                    <button type="button" onclick="location.href='/productspecificaion'">Specification</button>
                </td>
                <td></td>
            </tr>
            </tbody>
        </table>

        <div class="form-section" id="additionalcosts-fields" style="display: flex;">
            <div class="form-group">
                <label>Incoterm</label>
                <input type="text" name="incoterm_place" value="CIF" readonly>
                </select>
            </div>
            <div class="form-group">
                <label>Named Place</label>
                <input type="text" name="incoterm_place" value="CAL-KTM" readonly>
            </div>
            <div class="form-group">
                <label for="labourCharge">Labour Charge (Rs)</label>
                <input type="number" id="labourCharge" name="labourCharge" step="0.01" min="0" value="100" readonly/>
            </div>
            <div class="form-group">
                <label for="transportCharge">Transport Charge (Rs)</label>
                <input type="number" id="transportCharge" name="transportCharge" step="0.01" min="0" value="100" readonly/>
            </div>
            <div class="form-group">
                <label for="miscCharge">Miscellaneous (Rs)</label>
                <input type="number" id="miscCharge" name="miscCharge" step="0.01" min="0" value="200" readonly/>
            </div>
            <div class="form-group form-group-inline">
                <label for="totalInvoice">Total Invoice Amount (Rs)</label>
                <input type="number" id="totalInvoice" name="totalInvoice"  value="10000" readonly/>
            </div>
        </div>

        <div class="form-section">
            <div class="form-group" style="flex: 1 1 100%;">
                <label for="notes">Additional Notes</label>
                <textarea id="notes" name="notes" rows="3" value="" readonly>the books are very nice in color</textarea>
            </div>
        </div>
        
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const itemsTableBody = document.querySelector('#itemsTable tbody');
        const addRowBtn = document.getElementById('addRowBtn');

        // Show everything by default
        let damageVisible = true;

        window.toggleDamage = function() {
            damageVisible = !damageVisible;
            const toggleClass = damageVisible ? 'remove' : 'add';
            document.querySelectorAll('.damage-column').forEach(el => el.classList[toggleClass]('hidden'));
            document.querySelectorAll('.damage-checkbox, .damage-spec').forEach(el => el.classList[toggleClass]('hidden'));
        };

        addRowBtn.addEventListener('click', function() {
            const newRow = document.createElement('tr');

            newRow.innerHTML = `
                <td class="damage-column"><input type="checkbox" class="damage-checkbox"></td>
                <td><input type="text" name="item[]" placeholder="Item" readonly></td>
                <td><input type="number" name="quantity[]" placeholder="Quantity" readonly></td>
                <td><input type="number" name="unit[]" placeholder="Unit" readonly></td>
                <td><input type="number" name="remaining[]" placeholder="Remaining"></td>
                <td><input type="number" name="rate[]" placeholder="Rate"></td>
                <td><input type="number" name="total[]" placeholder="Total"></td>
                <td class="damage-column"><input type="text" class="damage-spec" name="damageSpec[]" placeholder="Specify"></td>
                <td class="addons-column">
                    <button type="button" onclick="location.href='/inventoryInsuranceRecord'">Insurance</button>
                    <button type="button" onclick="location.href='/productspecificaion'">Specification</button>
                </td>
                <td><button type="button" onclick="this.closest('tr').remove()">Remove</button></td>
            `;
            itemsTableBody.appendChild(newRow);
        });
    });
</script>
</body>
</html>
