<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Maintenance & Support Assignment Report</title>
    <link rel="stylesheet" th:href="@{/css/reports/maintainancereport.css}">
</head>
<body>
<div th:replace="header :: header"></div>
<div class="custom-form-container">
<h1>Maintenance & Support Assignment Report</h1>
<div class="custom-form-row">
    <div class="form-group">
        <label for="companyFilter">Company Name</label>
        <select id="companyFilter">
            <option value="">All Companies</option>
        </select>
    </div>

    <div class="form-group">
        <label for="typeFilter">Type</label>
        <select id="typeFilter">
            <option value="">All Types</option>
            <option value="Maintainer">Maintainer</option>
            <option value="Support">Support</option>
        </select>
    </div>
    <div class="form-group">
        <label for="filterDateFrom">Date From</label>
        <input type="date" id="filterDateFrom"/>
    </div>

    <div class="form-group">
        <label for="filterDateTo">Date To</label>
        <input type="date" id="filterDateTo"/>
    </div>
    <div class="form-actions">
        <input type="text" placeholder="Search..." id="generalSearch"/>
        <button class="custom-btn-search">SEARCH</button>
        <button class="custom-btn-reset">RESET</button>
    </div>
</div>
    <section th:replace="layout/table"></section>
</div>

<script src="/js/layout/layout.js"></script>
<script src="/js/reports/maintainancereport.js"></script>
</body>
</html>
