<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiple Code Generators</title>
    <link rel="stylesheet" th:href="@{/css/utility/codegenerator.css}">
</head>
<body>
<div th:replace="header :: header"></div>
<div id="formsContainer">
    <form class="code-form">
        <h3>Form Title</h3>
        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" name="auto_generate">
                Auto generate code?
            </label>
        </div>
        <div class="manualFields">
            <div class="fieldsContainer">
                <div class="inline-fields">
                    <div class="form-group">
                        <label>Code Name</label>
                        <input type="text" name="code_name[]">
                    </div>
                    <div class="form-group">
                        <label>Code</label>
                        <input type="text" name="code[]">
                    </div>
                    <button type="button" class="remove-row-btn">Remove</button>
                </div>
            </div>
            <button type="button" class="add-row-btn">+ Add Row</button>
        </div>
        <button type="submit" class="save-btn">Save</button>
    </form>
</div>
    <script src="/js/utility/codegenerator.js"></script>
</body>
</html>
