<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Damage Details - Inventory System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        h2 { color: #000; border-bottom: 2px solid #000; padding-bottom: 0.5rem; margin-bottom: 2rem; font-size: 2rem; font-weight: 600; letter-spacing: 0.01em; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; background: #fff; }
        th, td { border: 1px solid #000; padding: 0.65rem 0.4rem; text-align: left; font-size: 1rem; }
        th { background: #f5f5f5; color: #000; font-weight: 700; text-align: center; }
        tr:nth-child(even) td { background: #fafafa; }
        tr:nth-child(odd) td { background: #fff; }
        .back-btn, .save-btn { padding: 0.7rem 1.7rem; background: #000; color: #fff; border: none; border-radius: 3px; font-size: 1rem; cursor: pointer; margin-right: 8px; transition: background 0.15s linear; }
        .back-btn:hover, .save-btn:hover { background: #222; }
        @media (max-width: 650px) {
            .container { padding: 12px; }
            th, td { font-size: 0.9rem; padding: 0.4rem 0.2rem; }
        }
        input[type="text"], input[type="number"] {
            width: 98%;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 3px;
            padding: 2px 4px;
            font-size: 1rem;
            background: #fff;
        }
    </style>
</head>
<body>
<h2>Damage Details</h2>
<form id="damageDetailsForm">
    <table>
        <thead>
        <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Rate</th>
            <th>Total</th>
            <th>Damage Notes</th>
        </tr>
        </thead>
        <tbody>
        <!-- Editable rows will be injected here -->
        </tbody>
    </table>
    <button class="save-btn" type="button" onclick="saveDamageDetails()">Save</button>
    <button class="back-btn" type="button" onclick="window.location.href='/goodreceivingnote'">Back to GRN</button>
</form>
<script>
    // Render editable table from localStorage
    document.addEventListener('DOMContentLoaded', function () {
        const tbody = document.querySelector('table tbody');
        tbody.innerHTML = '';
        const damageDetails = JSON.parse(localStorage.getItem('damageDetails') || '[]');

        if (damageDetails.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5">No damaged items submitted.</td></tr>';
            return;
        }

        damageDetails.forEach((item, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" name="item" value="${item.item}" required></td>
                <td><input type="number" name="quantity" value="${item.quantity}" min="1" required></td>
                <td><input type="number" name="rate" value="${item.rate}" step="0.01" min="0" required></td>
                <td><input type="number" name="total" value="${item.total}" step="0.01" min="0" required></td>
                <td><input type="text" name="notes" value="${item.notes || ''}"></td>
            `;
            tbody.appendChild(tr);
        });
    });

    function saveDamageDetails() {
        const form = document.getElementById('damageDetailsForm');
        const rows = Array.from(form.querySelectorAll('tbody tr'));
        const items = rows.map(row => {
            const cells = row.querySelectorAll('input');
            return {
                item: cells[0].value,
                quantity: cells[1].value,
                rate: cells[2].value,
                total: cells[3].value,
                notes: cells[4].value
            };
        });

        // Submit via AJAX to backend
        fetch('/submit-damages', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ items })
        })
            .then(response => {
                if (response.ok) {
                    // Optionally clear localStorage, alert, or redirect
                    localStorage.removeItem('damageDetails');
                    alert('Damage details saved!');
                    // window.location.href = '/somewhere';
                } else {
                    alert('Save failed.');
                }
            })
            .catch(() => alert('Network error.'));
    }
</script>
</body>
</html>
